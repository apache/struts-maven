github:
  del_branch_on_merge: true
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
        excludes: []
      bypass_teams:
        - "root"
        - "struts-committers"
      restrict_deletion: true
      restrict_force_push: true
